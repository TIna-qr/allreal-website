<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>驗證成功｜AllReal</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#f5f5f5;
      font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
      color:#111;
    }

    .page{
      max-width:430px;
      margin:0 auto;
      min-height:100vh;
      background:white;
      box-shadow:0 0 35px rgba(0,0,0,.15);
    }

    header{
      height:86px;
      background:#050505;
      border-bottom:2px solid #d9a441;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 26px;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
      color:white;
      font-size:28px;
      font-weight:800;
    }

    .logo-mark{
      color:#d9a441;
      font-size:38px;
      font-weight:900;
      letter-spacing:-5px;
    }

    .menu{
      width:34px;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .menu span{
      height:4px;
      background:white;
      border-radius:999px;
    }

    .hero{
      height:360px;

      background:
      linear-gradient(rgba(2,6,12,.75),rgba(2,6,12,.75)),
      url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=80");

      background-size:cover;
      background-position:center;

      color:white;

      position:relative;

      padding:34px 28px;
    }

    .back{
      color:white;
      text-decoration:none;
      font-size:20px;
    }

    .hero-center{
      text-align:center;
      margin-top:55px;
    }

    .hero h1{
      font-size:58px;
      font-weight:900;
      letter-spacing:3px;
      margin-bottom:18px;
    }

    .gold-line{
      width:90px;
      height:4px;
      background:#d9a441;
      border-radius:999px;
      margin:0 auto 26px;
      position:relative;
    }

    .gold-line::after{
      content:"";
      width:9px;
      height:9px;
      border-radius:50%;
      background:#d9a441;
      position:absolute;
      right:-18px;
      top:-2px;
    }

    .hero p{
      font-size:18px;
      line-height:1.9;
      color:#f0f0f0;
    }

    .content{
      padding:55px 34px;
      text-align:center;
    }

    .success-icon{
      width:110px;
      height:110px;
      border-radius:50%;
      border:2px solid rgba(217,164,65,.25);

      color:#d9a441;

      font-size:56px;

      display:flex;
      align-items:center;
      justify-content:center;

      margin:0 auto 34px;
    }

    .content h2{
      font-size:42px;
      font-weight:900;
      margin-bottom:18px;
    }

    .desc{
      color:#888;
      font-size:18px;
      line-height:1.9;
      margin-bottom:36px;
    }

    .wechat-card{
      background:#08c160;

      border-radius:22px;

      padding:28px 24px;

      color:white;

      margin-bottom:42px;

      box-shadow:0 10px 28px rgba(0,0,0,.12);
    }

    .wechat-title{
      font-size:34px;
      font-weight:900;
      margin-bottom:22px;
    }

    .wechat-card img{
      width:240px;
      max-width:100%;

      background:white;

      padding:12px;

      border-radius:14px;

      margin-bottom:22px;
    }

    .wechat-name{
      background:white;

      color:#333;

      border-radius:10px;

      padding:14px;

      font-size:17px;

      font-weight:700;
    }

    .warm-title{
      display:flex;
      align-items:center;
      gap:14px;

      color:#333;

      font-size:22px;
      font-weight:900;

      margin-bottom:18px;
    }

    .warm-title::before,
    .warm-title::after{
      content:"";
      flex:1;
      height:1px;
      background:#ddd;
    }

    .warm-text{
      color:#999;
      line-height:1.9;
      font-size:17px;
    }

    footer{
      background:#050505;
      color:#999;
      text-align:center;
      padding:28px 16px;
      font-size:16px;
      margin-top:40px;
    }

  </style>
</head>

<body>

<div class="page">

  <header>

    <div class="logo">
      <div class="logo-mark">AR</div>
      <div>AllReal</div>
    </div>

    <div class="menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </header>

  <section class="hero">

    <a href="index.html" class="back">
      ← 返回服務項目
    </a>

    <div class="hero-center">

      <h1>驗證成功！</h1>

      <div class="gold-line"></div>

      <p>
        感謝您的驗證，請掃描下方二維碼<br>
        關注我們的微信服務號，以獲取更多服務與資訊
      </p>

    </div>

  </section>

  <section class="content">

    <div class="success-icon">✓</div>

    <h2>驗證碼正確</h2>

    <div class="desc">
      請掃描下方二維碼，關注我們的微信服務號
    </div>

    <div class="wechat-card">

      <div class="wechat-title">
        微信搜一搜
      </div>

      <img
        src="images/wechat-qrcode.png"
        alt="微信服務號 QR Code"
      >

      <div class="wechat-name">
        上海日測光電子科技有限公司
      </div>

    </div>

    <div class="warm-title">
      溫馨提示
    </div>

    <div class="warm-text">
      如無法掃描，請保存圖片後使用微信掃描<br>
      或在微信中搜索服務號名稱
    </div>

  </section>

  <footer>
    © 2025 AllReal. All rights reserved.
  </footer>

</div>

</body>
</html>
